<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-tag">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title"> E-Clearance Portal - شاشەیا قوتابی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.28/build/spline-viewer.js"></script>
    <style>
        :root {
            --bg-dark: #040714;
            --bg-card: rgba(11, 17, 34, 0.58);
            --glass-border: rgba(0, 240, 255, 0.14);
            --glass-border-hover: rgba(0, 240, 255, 0.35);
            --acc-cyan: #00f0ff;
            --acc-cyan-glow: rgba(0, 240, 255, 0.25);
            --acc-blue: #3b82f6;
            --acc-purple: #a855f7;
            --acc-emerald: #10b981;
            --acc-amber: #f59e0b;
            --acc-rose: #f43f5e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(ellipse at 15% 15%, rgba(0, 240, 255, 0.09) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 25%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* ── Canvas Particles & Background Orbs ── */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            mix-blend-mode: screen;
            animation: orbFloat 22s infinite ease-in-out alternate;
        }

        .bg-glow-orb-1 {
            top: 10%;
            left: 10%;
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.16) 0%, rgba(0, 240, 255, 0) 70%);
            animation-duration: 24s;
        }

        .bg-glow-orb-2 {
            bottom: 8%;
            right: 8%;
            width: 42vw;
            height: 42vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0) 70%);
            animation-duration: 28s;
            animation-delay: -6s;
        }

        .bg-glow-orb-3 {
            top: 45%;
            left: 45%;
            transform: translate(-50%, -50%);
            width: 32vw;
            height: 32vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.09) 0%, rgba(16, 185, 129, 0) 70%);
            animation-duration: 20s;
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            50% {
                transform: translate(3%, -5%) scale(1.08) rotate(60deg);
            }

            100% {
                transform: translate(-3%, 3%) scale(0.92) rotate(120deg);
            }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.025;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            transition: opacity 1s ease;
        }

        /* ── Language Switcher ── */
        .lang-switcher {
            position: fixed;
            top: 18px;
            z-index: 999999;
        }

        html[dir="ltr"] .lang-switcher {
            left: 18px;
            right: auto;
        }

        html[dir="rtl"] .lang-switcher {
            right: 18px;
            left: auto;
        }

        .lang-btn {
            background: rgba(11, 17, 34, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .lang-btn:hover {
            background: rgba(18, 28, 54, 0.8);
            border-color: rgba(0, 240, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 240, 255, 0.15);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(8, 13, 26, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 5px;
            display: none;
            flex-direction: column;
            gap: 3px;
            min-width: 145px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
            transform-origin: top;
        }

        html[dir="ltr"] .lang-menu {
            right: auto;
            left: 0;
        }

        .lang-menu.show {
            display: flex;
            animation: scaleIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: translateY(-6px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lang-option {
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .lang-option:hover {
            background: rgba(0, 240, 255, 0.08);
            color: var(--acc-cyan);
        }

        .lang-option.active {
            background: rgba(0, 240, 255, 0.14);
            color: var(--acc-cyan);
            font-weight: 700;
        }

        /* ── Main Layout Container ── */
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 16px 40px;
        }

        /* ── Branding Header ── */
        .portal-brand {
            text-align: center;
            margin-bottom: 24px;
            animation: slideFadeDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portal-brand .brand-icon {
            font-size: 2.6rem;
            display: inline-block;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 16px var(--acc-cyan-glow));
            animation: floatUpDown 4s ease-in-out infinite;
        }

        @keyframes floatUpDown {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-5px) scale(1.03);
            }
        }

        .portal-brand h1 {
            font-size: 1.65rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f0ff, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .portal-brand p {
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @keyframes slideFadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── HOD Approval Banner ── */
        #hod-pending-banner {
            width: 100%;
            max-width: 780px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(245, 158, 11, 0.03) 100%);
            border: 1px solid rgba(245, 158, 11, 0.32);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideFadeDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
            overflow: hidden;
        }

        #hod-pending-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc-amber), #fcd34d, transparent);
        }

        .hod-banner-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            animation: heartbeat 2s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .hod-banner-content {
            flex: 1;
            text-align: right;
        }

        html[dir="ltr"] .hod-banner-content {
            text-align: left;
        }

        .hod-banner-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--acc-amber);
            margin-bottom: 2px;
        }

        .hod-banner-sub {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .hod-banner-dots {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .hod-banner-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--acc-amber);
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .hod-banner-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .hod-banner-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .hod-banner-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounceDot {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        #hod-pending-banner.approved-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.03) 100%);
            border-color: rgba(16, 185, 129, 0.32);
        }

        #hod-pending-banner.approved-banner::before {
            background: linear-gradient(90deg, transparent, var(--acc-emerald), #34d399, transparent);
        }

        #hod-pending-banner.approved-banner .hod-banner-title {
            color: #34d399;
        }

        #hod-pending-banner.approved-banner .hod-banner-dot {
            background: #34d399;
        }

        /* ── Student Information Card (Compact & Refined) ── */
        .student-info-card {
            background: linear-gradient(135deg, rgba(12, 18, 36, 0.6) 0%, rgba(6, 10, 22, 0.7) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 240, 255, 0.16);
            padding: 26px 30px;
            border-radius: 22px;
            width: 100%;
            max-width: 780px;
            margin: 0 auto 20px;
            text-align: center;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(0, 240, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: slideFadeDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .student-info-card:hover {
            border-color: rgba(0, 240, 255, 0.28);
            box-shadow:
                0 25px 55px rgba(0, 0, 0, 0.65),
                0 0 45px rgba(0, 240, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .student-info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc-cyan), var(--acc-blue), transparent);
        }

        .student-avatar-big {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--acc-cyan) 0%, var(--acc-blue) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: 800;
            color: #040814;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.35);
            position: relative;
        }

        .student-avatar-big::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 23px;
            border: 1.5px dashed rgba(0, 240, 255, 0.35);
            animation: spinBorder 15s linear infinite;
        }

        @keyframes spinBorder {
            100% {
                transform: rotate(360deg);
            }
        }

        .student-info-card h2 {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .student-info-card h2 span#student-name {
            background: linear-gradient(135deg, #00f0ff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 850;
        }

        .student-info-card .detail-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 500;
            margin: 4px 3px 0;
            transition: all 0.25s ease;
        }

        .student-info-card .detail-pill:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        /* ── Status Grid & Cards (Tighter, Refined, Sleek) ── */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            animation: slideFadeDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        .status-card {
            background: rgba(12, 18, 36, 0.52);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 20px 16px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            animation: fadeInUpCard 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;

            --card-acc: var(--acc-cyan);
            --card-acc-glow: rgba(0, 240, 255, 0.18);
        }

        @keyframes fadeInUpCard {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .status-card:nth-child(1) {
            animation-delay: 0.12s;
        }

        .status-card:nth-child(2) {
            animation-delay: 0.18s;
        }

        .status-card:nth-child(3) {
            animation-delay: 0.24s;
        }

        .status-card:nth-child(4) {
            animation-delay: 0.3s;
        }

        .status-card:nth-child(5) {
            animation-delay: 0.36s;
        }

        .status-card:nth-child(6) {
            animation-delay: 0.42s;
        }

        .status-card.card-registration {
            --card-acc: var(--acc-cyan);
            --card-acc-glow: rgba(0, 240, 255, 0.2);
        }

        .status-card.card-library {
            --card-acc: var(--acc-purple);
            --card-acc-glow: rgba(168, 85, 247, 0.22);
        }

        .status-card.card-dormitory,
        .status-card.card-dorm {
            --card-acc: var(--acc-amber);
            --card-acc-glow: rgba(245, 158, 11, 0.2);
        }

        .status-card.card-finance,
        .status-card.card-fin {
            --card-acc: var(--acc-emerald);
            --card-acc-glow: rgba(16, 185, 129, 0.2);
        }

        .status-card.card-assistant_dean,
        .status-card.card-assistant-dean {
            --card-acc: var(--acc-rose);
            --card-acc-glow: rgba(248, 113, 113, 0.2);
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04), transparent 70%);
            pointer-events: none;
        }

        .status-card:hover:not(.card-locked) {
            transform: translateY(-5px) scale(1.015);
            border-color: var(--card-acc);
            background: rgba(16, 24, 46, 0.65);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.5),
                0 0 28px var(--card-acc-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .status-card .card-icon {
            font-size: 1.8rem;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.15));
        }

        .status-card:hover:not(.card-locked) .card-icon {
            transform: scale(1.12) rotate(4deg);
            filter: drop-shadow(0 0 12px var(--card-acc));
        }

        .status-card h3 {
            font-size: 0.98rem;
            font-weight: 750;
            color: #f1f5f9;
            text-align: center;
            letter-spacing: 0.1px;
            transition: color 0.3s;
        }

        .status-card:hover:not(.card-locked) h3 {
            color: #fff;
        }

        /* ── Status Badges Styling ── */
        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            transition: all 0.25s ease;
        }

        .status-card .badge:not(.approved):not(.pending) {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .status-card:hover:not(.card-locked) .badge:not(.approved):not(.pending) {
            background: var(--card-acc);
            color: #040814;
            border-color: var(--card-acc);
            box-shadow: 0 4px 12px var(--card-acc-glow);
        }

        .badge.approved {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.28);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge.approved::after {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #34d399;
            box-shadow: 0 0 6px #34d399;
            display: inline-block;
            animation: pulseDotGreen 1.8s infinite ease-in-out;
        }

        @keyframes pulseDotGreen {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        .badge.pending {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.28);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge.pending::after {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #fbbf24;
            box-shadow: 0 0 6px #fbbf24;
            display: inline-block;
            animation: pulseDotAmber 1.8s infinite ease-in-out;
        }

        @keyframes pulseDotAmber {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        .note-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78rem;
            color: #fcd34d;
            text-align: center;
            max-width: 95%;
            line-height: 1.35;
        }

        .status-card.card-locked {
            cursor: not-allowed;
            opacity: 0.5;
            filter: grayscale(80%);
            border-color: rgba(255, 255, 255, 0.03) !important;
            background: rgba(12, 18, 36, 0.25) !important;
            box-shadow: none !important;
        }

        .status-card.card-locked:hover {
            transform: none !important;
        }

        .lock-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 1rem;

    <!-- ══ Background Particle Canvas Script ══ -->
    <script>
        (function () {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = Array.from({ length: 40 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.8 + 0.6,
                dx: (Math.random() - 0.5) * 0.35,
                dy: (Math.random() - 0.5) * 0.35,
                alpha: Math.random() * 0.55 + 0.15,
                color: ['#00f0ff', '#3b82f6', '#a855f7', '#10b981', '#ffffff'][Math.floor(Math.random() * 5)]
            }));

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>

    <script>
        const injectModalCSS = () => {
            if (document.getElementById('custom-modal-styles')) return;
            const style = document.createElement('style');
            style.id = 'custom-modal-styles';
            style.innerHTML = `
                .custom-modal-backdrop {
                    position: fixed; inset: 0; background: rgba(3, 5, 12, 0.75);
                    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);

                .custom-modal-backdrop.show { opacity: 1; }
                .custom-modal-card {
                    background: linear-gradient(135deg, rgba(12, 18, 36, 0.92) 0%, rgba(6, 10, 22, 0.96) 100%);
                    border: 1px solid rgba(0, 240, 255, 0.18); border-radius: 20px;
                    padding: 24px 20px 20px; width: 100%; max-width: 390px; text-align: center;
                    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08);
                    transform: scale(0.92) translateY(10px); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                    direction: rtl;
                }
                html[dir="ltr"] .custom-modal-card { direction: ltr; }
                .custom-modal-backdrop.show .custom-modal-card { transform: scale(1) translateY(0); }
                .custom-modal-icon {

                    animation: modalIconPulse 2s infinite ease-in-out;
                }
                @keyframes modalIconPulse {
                    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.2)); }
                    50% { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.45)); }
                }
                .custom-modal-title {
                    font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; color: #fff;
                    background: linear-gradient(135deg, #00f0ff, #3b82f6);
                    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                    line-height: 1.3;
                }
                .custom-modal-message { font-size: 0.86rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 18px; }
                .custom-modal-actions { display: flex; gap: 10px; justify-content: center; }
                .custom-modal-btn {
                    flex: 1; padding: 10px 16px; border-radius: 11px; font-weight: 700;
                    font-size: 0.88rem; cursor: pointer; border: none; transition: all 0.2s ease;
                    font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
                }
                .custom-modal-btn.btn-confirm {
                    background: linear-gradient(135deg, #00f0ff, #0088ff); color: #040814;
                    box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
                }
                .custom-modal-btn.btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 240, 255, 0.4); }
                .custom-modal-btn.btn-cancel {
                    background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1);
                }
                .custom-modal-btn.btn-cancel:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-2px); }
            `;
            document.head.appendChild(style);
        };

        window.customAlert = (message, title = '') => {
            injectModalCSS();
            return new Promise((resolve) => {
                const backdrop = document.createElement('div');
                backdrop.className = 'custom-modal-backdrop';

                let icon = '🎓';
                if (message.includes('خەلەت') || message.includes('error') || message.includes('كێشە') || message.includes('کێشە') || message.includes('wrong') || message.includes('failed') || message.includes('invalid') || message.includes('نەهاتینە')) {
                    icon = '❌';
                } else if (message.includes('پەسەند') || message.includes('سەرکەفت') || message.includes('success') || message.includes('saved') || message.includes('تۆمار') || message.includes('approved') || message.includes('پاشەکەوت')) {
                    icon = '✅';
                } else if (message.includes('⚠️') || message.includes('ئاگەهدار') || message.includes('پڕ بکە') || message.includes('تکایە')) {
                    icon = '⚠️';
                }

                const isRtl = document.documentElement.getAttribute('dir') === 'rtl';
                const okText = isRtl ? 'باشە' : 'OK';

                backdrop.innerHTML = `
                    <div class="custom-modal-card">
                        <div class="custom-modal-icon">${icon}</div>
                        <div class="custom-modal-title">${title || (isRtl ? 'ئاگەهداری' : 'Notification')}</div>
                        <div class="custom-modal-message">${message}</div>
                        <div class="custom-modal-actions">
                            <button class="custom-modal-btn btn-confirm" id="custom-modal-ok-btn">${okText}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(backdrop);

                setTimeout(() => backdrop.classList.add('show'), 10);

                const closeAlert = () => {
                    backdrop.classList.remove('show');
                    setTimeout(() => {
                        backdrop.remove();
                        resolve();
                    }, 250);
                };

                backdrop.querySelector('#custom-modal-ok-btn').addEventListener('click', closeAlert);
                backdrop.addEventListener('click', (e) => {
                    if (e.target === backdrop) closeAlert();
                });

                const keyHandler = (e) => {
                    if (e.key === 'Enter' || e.key === 'Escape') {
                        e.preventDefault();
                        document.removeEventListener('keydown', keyHandler);
                        closeAlert();
                    }
                };
                document.addEventListener('keydown', keyHandler);

                setTimeout(() => backdrop.querySelector('#custom-modal-ok-btn').focus(), 50);
            });
        };

        window.customConfirm = (message, title = '') => {
            injectModalCSS();
            return new Promise((resolve) => {
                const backdrop = document.createElement('div');
                backdrop.className = 'custom-modal-backdrop';

                let icon = '❓';
                if (message.includes('ژێ') || message.includes('دەر') || message.includes('delete') || message.includes('remove') || message.includes('logout')) {
                    icon = '⚠️';
                }

                const isRtl = document.documentElement.getAttribute('dir') === 'rtl';
                const yesText = isRtl ? 'بەڵێ' : 'Confirm';

        window.renderClearanceCards = function (cards, studentData) {
            const grid = document.getElementById('status-grid');
            if (!grid) return;
            grid.innerHTML = '';

            Object.values(cards).forEach(card => {
                const cardId = card.id;
                const statusVal = studentData ? studentData['status_' + cardId] : null;
                const noteVal = studentData ? studentData['note_' + cardId] : null;

                let titleText = card['name_' + currentLang] || card.name_ku || cardId;

                const _finalIds = ['assistant_dean', 'assistantdean', 'vice_dean', 'dean_assistant', 'supervisor', 'harikar', 'ragiri', 'muawin'];
                const _cardNameAll = [
                    card.name_ku || '', card.name_ar || '', card.name_en || ''
                ].join(' ').toLowerCase();
                const _finalKeywords = ['هاریکار', 'معاون', 'راگری', 'assistant dean', 'vice dean', 'dean assistant'];
                const _isFinalByFlag = card.is_final === true || card.is_final === 'true' || card.is_final === 1;
                const _isFinalById = _finalIds.includes(cardId);
                const _isFinalByName = _finalKeywords.some(k => _cardNameAll.includes(k));
                const isFinalCard = _isFinalByFlag || _isFinalById || _isFinalByName;

                let isLocked = false;
                if (isFinalCard && statusVal !== 'Approved') {
                    const otherCardIds = Object.keys(cards).filter(id => id !== cardId);
                    const allOtherApproved = otherCardIds.every(id => studentData && studentData['status_' + id] === 'Approved');
                    if (!allOtherApproved) {
                        isLocked = true;
                    }
                }

                const cardDiv = document.createElement('div');
                cardDiv.className = 'status-card' + (isLocked ? ' card-locked' : '');
                if (cardId) cardDiv.classList.add('card-' + cardId);

                cardDiv.onclick = () => window.requestClearance(cardId);

                cardDiv.innerHTML = `
                    ${isLocked ? '<span class="lock-overlay">🔒</span>' : ''}
                    <span class="card-icon">${card.icon || '📋'}</span>
                    <h3>${titleText}</h3>
                    <div class="badge" id="status-${cardId}">👆 <span>${t('clickReq')}</span></div>
                    <div class="note-box" id="note-${cardId}" style="display:none;"></div>
                    ${isLocked ? '<p class="lock-hint">تکایە پێدڤییە هەمی بەشێن دی واژۆ بکەن</p>' : ''}
                `;

                grid.appendChild(cardDiv);

                window.updateCardStatus(`status-${cardId}`, statusVal, noteVal, `note-${cardId}`);
            });
        };

        window.requestClearance = function (deptId) {
            if (latestData && latestData['status_' + deptId] === 'Approved') {
                customAlert(window.t('alertReq'));
                return;
            }

            const thisCard = window.globalClearanceCards && window.globalClearanceCards[deptId];

            const _chkFinalIds = ['assistant_dean', 'assistantdean', 'vice_dean', 'dean_assistant', 'supervisor', 'harikar', 'ragiri', 'muawin'];
            const _chkNameAll = [
                thisCard && (thisCard.name_ku || ''),
                thisCard && (thisCard.name_ar || ''),
                thisCard && (thisCard.name_en || '')
            ].join(' ').toLowerCase();
            const _chkKeywords = ['هاریکار', 'معاون', 'راگری', 'assistant dean', 'vice dean', 'dean assistant'];

            const isFinalDept =
                (thisCard && (thisCard.is_final === true || thisCard.is_final === 'true' || thisCard.is_final === 1)) ||
                _chkFinalIds.includes(deptId) ||
                _chkKeywords.some(k => _chkNameAll.includes(k));

            if (isFinalDept) {
                const allCards = window.globalClearanceCards || {};
                const otherCardIds = Object.keys(allCards).filter(id => id !== deptId);

                const notApprovedCards = otherCardIds.filter(id => {
                    const st = latestData && latestData['status_' + id];
                    return st !== 'Approved';
                });

                if (notApprovedCards.length > 0) {
                    customAlert("تکایە خو بگرە هەتا واژو سەر هەمی بەشێن دی بهێنە کرن، شنی زڤرەڤە.");
                    return;
                }
            }

            const now = new Date();
            const updates = {};
            updates[`Clearance_Requests/${studentId}/status_${deptId}`] = "Pending";
            updates[`Clearance_Requests/${studentId}/date_requested_${deptId}`] = now.toISOString();

            window.renderClearanceCards(window.globalClearanceCards, latestData);

        onValue(ref(db, 'Clearance_Requests/' + studentId), snapshot => {
            if (!snapshot.exists()) return;
            const data = snapshot.val();
            latestData = data;

            const firstChar = data.name ? data.name.trim().charAt(0) : 'ق';

        window.closeToast = function () {
            const toast = document.getElementById('clearance-toast');
            if (!toast) return;
            toast.style.transition = 'opacity 0.45s ease';
            toast.style.opacity = '0';
            setTimeout(() => {
                toast.classList.remove('toast-visible');
                toast.style.opacity = '';
                toast.style.transition = '';
                document.body.style.overflow = '';
                document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
            }, 460);
        };

        function launchConfetti() {
            const colors = ['#00ffa0', '#00d4ff', '#a855f7', '#f59e0b', '#f87171', '#3b82f6', '#fbbf24', '#10b981'];
            const shapes = ['2px', '50%'];
            for (let i = 0; i < 80; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const size = 6 + Math.random() * 8;
                el.style.cssText = [
                    `width:${size}px`,
                    `height:${size}px`,
                    `background:${colors[Math.floor(Math.random() * colors.length)]}`,
                    `border-radius:${shapes[Math.floor(Math.random() * shapes.length)]}`,
                    `left:${Math.random() * 100}vw`,
                    `top:-${10 + Math.random() * 30}px`,
                    `animation-duration:${2.5 + Math.random() * 3}s`,
                    `animation-delay:${Math.random() * 1.5}s`,
                    `transform:rotate(${Math.random() * 360}deg)`
                ].join(';');
                document.body.appendChild(el);
            }
        }
    </script>

</body>

</html>
